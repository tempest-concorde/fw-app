name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Semantic Release
    uses: tempest-concorde/fw-cicd/.github/workflows/semantic-release.yml@main
    with:
      use_local_config: false
    secrets: inherit

  build:
    name: Build and push container
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    uses: tempest-concorde/fw-cicd/.github/workflows/build-container.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-app
      platform: linux/arm64
      containerfile: Containerfile
      push: true
      tags: ${{ needs.release.outputs.new_release_version }} latest
      version: ${{ needs.release.outputs.new_release_version }}
      is_release: true
    secrets: inherit

  sign:
    name: Sign container image
    needs: [release, build]
    if: needs.release.outputs.new_release_published == 'true'
    uses: tempest-concorde/fw-cicd/.github/workflows/cosign-sign-verify.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-app
      image_digest: ${{ needs.build.outputs.digest }}
      version: ${{ needs.release.outputs.new_release_version }}
      signing_mode: key
    secrets: inherit

  dispatch:
    name: Trigger fw-os update
    needs: [release, build, sign]
    if: needs.release.outputs.new_release_published == 'true'
    uses: tempest-concorde/fw-cicd/.github/workflows/cascade-dispatch.yml@main
    with:
      downstream_repo: tempest-concorde/fw-os
      event_type: fw-app-released
      client_payload: >-
        {"version":"${{ needs.release.outputs.new_release_version }}","digest":"${{ needs.build.outputs.digest }}","registry":"ghcr.io","image":"tempest-concorde/fw-app","run_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
    secrets: inherit
