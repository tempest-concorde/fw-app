name: CI

on:
  pull_request:
    branches: [main]

jobs:
  commitlint:
    name: Lint PR title
    uses: tempest-concorde/fw-cicd/.github/workflows/commitlint.yml@main

  quality:
    name: Go quality gates
    uses: tempest-concorde/fw-cicd/.github/workflows/go-quality.yml@main
    with:
      golangci_lint_version: v2.12

  test:
    name: Test
    uses: tempest-concorde/fw-cicd/.github/workflows/go-test.yml@main

  frontend:
    name: Frontend build & lint
    uses: tempest-concorde/fw-cicd/.github/workflows/build-web.yml@main
    with:
      working_directory: web

  build-check:
    name: Build container (no push)
    uses: tempest-concorde/fw-cicd/.github/workflows/build-container.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-app
      platform: linux/arm64
      containerfile: Containerfile
      push: false
    secrets: inherit

  # fw-gsd specs/004-fedora-version-alignment (T018): constitution gate.
  # NOTE: this job WILL FAIL until tempest-concorde/fw-cicd merges
  # baseline-audit.yml to main (deliberate W4a-first wave ordering).
  baseline-audit:
    name: Baseline audit (Fedora 46 baseline)
    uses: tempest-concorde/fw-cicd/.github/workflows/baseline-audit.yml@main
    with:
      baseline: "46"
