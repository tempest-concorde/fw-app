name: TEMP tidy xcrypto (run once)

on:
  workflow_dispatch:

jobs:
  tidy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/xcrypto-cve-2026-56854
          token: ${{ github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy
      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "chore(deps): go mod tidy after x/crypto bump [dependabot skip]"
            git push origin "HEAD:fix/xcrypto-cve-2026-56854"
            echo "pushed tidied files"
          }
